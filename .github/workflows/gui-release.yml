name: Build and publish GUI release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  build-rpm:
    name: Build Fedora RPM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build package in Fedora
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            fedora:latest \
            bash -lc 'dnf install -y rpm-build systemd-rpm-macros python3-devel tar && ./scripts/build-packages.sh --rpm'
      - uses: actions/upload-artifact@v7
        with:
          name: gui-rpm
          path: dist/packages/*
          retention-days: 1

  build-arch:
    name: Build Arch package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build package in Arch Linux
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            archlinux:latest \
            bash -lc 'pacman -Syu --noconfirm base-devel python && useradd --create-home builder && chown -R builder:builder /workspace && su builder -c "./scripts/build-packages.sh --arch"'
      - uses: actions/upload-artifact@v7
        with:
          name: gui-arch
          path: dist/packages/*
          retention-days: 1

  build-deb:
    name: Build Debian package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build package in Debian
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            debian:stable \
            bash -lc 'apt-get update && apt-get install -y dpkg-dev bash ca-certificates tar && ./scripts/build-packages.sh --deb'
      - uses: actions/upload-artifact@v7
        with:
          name: gui-deb
          path: dist/packages/*
          retention-days: 1

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: [build-rpm, build-arch, build-deb]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist/packages
          merge-multiple: true
      - name: List release files
        run: find dist/packages -maxdepth 1 -type f -printf '%f\n' | sort
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t release_files < <(find dist/packages -type f -print | sort)
          gh release create "${GITHUB_REF_NAME}" "${release_files[@]}" \
            --target "${GITHUB_SHA}" \
            --title "rivalcfg GUI ${GITHUB_REF_NAME#v}" \
            --generate-notes
